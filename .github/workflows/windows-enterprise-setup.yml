name: Windows Enterprise Setup

on:
  workflow_dispatch:
    inputs:
      ai_common_ref:
        description: Exact ai-common branch, tag, or commit containing the approved CMID overlay.
        required: true
        default: develop
        type: string

permissions:
  contents: read

concurrency:
  group: windows-enterprise-setup-${{ github.ref }}
  cancel-in-progress: false

jobs:
  managed-gateway:
    name: Prepare CMID-enabled Windows gateway
    runs-on: ubuntu-latest
    environment: windows-enterprise-build
    timeout-minutes: 30
    steps:
      - name: Check out DefenseClaw
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Require the protected private-repository credential
        shell: bash
        env:
          AI_COMMON_READ_TOKEN: ${{ secrets.AI_COMMON_READ_TOKEN }}
        run: |
          if [[ -z "${AI_COMMON_READ_TOKEN}" ]]; then
            echo 'AI_COMMON_READ_TOKEN is required in the windows-enterprise-build environment.' >&2
            exit 1
          fi

      - name: Check out the approved CMID source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: cisco-aispg/ai-common
          ref: ${{ inputs.ai_common_ref }}
          token: ${{ secrets.AI_COMMON_READ_TOKEN }}
          persist-credentials: false
          path: .private/ai-common

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve package version
        id: version
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' pyproject.toml)"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9_.-]+)?$ ]]; then
            echo "invalid DefenseClaw package version: ${version}" >&2
            exit 1
          fi
          echo "value=${version}" >> "${GITHUB_OUTPUT}"

      - name: Build the exact managed gateway inputs
        shell: bash
        run: >-
          packaging/scripts/build-managed-windows-bundle.sh
          --ref HEAD
          --ai-common-dir "${GITHUB_WORKSPACE}/.private/ai-common"
          --version "${{ steps.version.outputs.value }}"
          --dist-dir "${GITHUB_WORKSPACE}/dist"

      - name: Upload commit-bound managed gateway inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-enterprise-gateway-input-${{ github.sha }}
          path: |
            dist/defenseclaw_${{ steps.version.outputs.value }}_windows_amd64.zip
            dist/gateway-source-commit.txt
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  enterprise-setup:
    name: Build unsigned enterprise Setup for certification
    needs: managed-gateway
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Check out DefenseClaw
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download the exact managed gateway inputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-enterprise-gateway-input-${{ github.sha }}
          path: dist

      - name: Resolve package version
        id: version
        shell: pwsh
        run: |
          $match = [regex]::Match(
            (Get-Content -LiteralPath pyproject.toml -Raw -Encoding UTF8),
            '(?m)^version = "([^"]+)"$'
          )
          if (-not $match.Success) { throw 'could not resolve the DefenseClaw package version' }
          "value=$($match.Groups[1].Value)" >> $env:GITHUB_OUTPUT

      - name: Build the self-contained enterprise Setup
        shell: pwsh
        run: |
          ./scripts/build-windows-enterprise-installer.ps1 `
            -DistRoot dist `
            -OutRoot dist/windows-enterprise-installer `
            -StateRoot (Join-Path $env:RUNNER_TEMP 'defenseclaw-enterprise-setup-build') `
            -Version '${{ steps.version.outputs.value }}' `
            -SkipSigning

      - name: Verify enterprise identity, elevation, provenance, and checksum
        shell: pwsh
        run: |
          $root = 'dist/windows-enterprise-installer'
          $setup = Join-Path $root 'DefenseClawSetup-Enterprise-x64.exe'
          $provenance = Get-Content -LiteralPath "$setup.provenance.json" -Raw -Encoding UTF8 | ConvertFrom-Json
          $commit = (git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($provenance.artifact -cne 'DefenseClawSetup-Enterprise-x64.exe' -or
              $provenance.distribution_flavor -cne 'managed-enterprise' -or
              [bool]$provenance.unsigned -ne $true -or
              $provenance.source_commit -cne $commit) {
            throw 'enterprise Setup provenance is not bound to this unsigned managed-enterprise build'
          }
          $actual = (Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -cne [string]$provenance.setup_sha256) {
            throw 'enterprise Setup checksum does not match provenance'
          }
          go run ./internal/tools/windowsresources `
            -target windows_amd64 `
            -executable $setup `
            -component enterprise-setup `
            -version '${{ steps.version.outputs.value }}' `
            -icon 'macos/DefenseClawMac/DefenseClawMac/Assets.xcassets/AppIcon.appiconset/icon_256.png' `
            -verify-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload the Windows 11 certification artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: DefenseClawSetup-Enterprise-x64-${{ github.sha }}-unsigned
          path: |
            dist/windows-enterprise-installer/DefenseClawSetup-Enterprise-x64.exe
            dist/windows-enterprise-installer/DefenseClawSetup-Enterprise-x64.exe.sha256
            dist/windows-enterprise-installer/DefenseClawSetup-Enterprise-x64.exe.provenance.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
