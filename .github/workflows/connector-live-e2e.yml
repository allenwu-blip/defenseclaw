            if (-not [string]::IsNullOrWhiteSpace([string]$path) -and
                (Test-Path -LiteralPath ([string]$path))) {
              throw "Refusing terminal cleanup while authenticated campaign state remains: $path"
            }
          }
          Remove-Item -LiteralPath $root -Recurse -Force

  # ---------------------------------------------------------------------------
  # Report — aggregate every cell, render the matrix, and alert on regressions.
  # ---------------------------------------------------------------------------
  report:
    name: Report + regression radar
    needs: [contract-matrix, live-matrix, windows-live, windows-antigravity-live, windows-antigravity-held-state]
    if: >-
      ${{ always() &&
          !(github.event_name == 'workflow_dispatch' &&
            inputs.connector == 'antigravity' &&
            inputs.antigravity_phase != 'automated') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required so the regression radar can open/update the
      # connector-regression issue. No write access to code.
      issues: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Download all cell results
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: connector-live-e2e-results-*
          path: results
          merge-multiple: true

      - name: Render summary + open regression issue on failure
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          open_flag=""
          # Only the trusted, scheduled / manual contexts may file issues.
          if [ "${EVENT_NAME}" = "schedule" ] || [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            open_flag="--open-issue"
          fi
          python3 scripts/live-connector-e2e/report.py \
            --results-dir results \
            ${open_flag} \
            --run-url "${RUN_URL}"
