# Live connector hook E2E + upstream regression radar.
#
# This workflow is intentionally SEPARATE from e2e.yml so it can go red
# (an upstream agent shipped a breaking hook change) without blocking the
# OpenClaw stack gate. It has two layers:
#
#   contract-matrix (Layer A) — deterministic, no LLM, no secrets, Unix.
#     Builds DefenseClaw, then feeds golden stdin payloads into the *installed*
#     hook entrypoint for every registry connector and asserts the gateway
#     received the event, the verdict was shaped correctly, and teardown is
#     clean. Fork-safe; runs on pull requests as well — one always-on macOS
#     cell (codex / macOS, intended as a required check) plus the full
#     Linux + macOS matrix when connector code changes. Deterministic native
#     Windows x64 contract checks live in windows-native.yml.
#
#   live-matrix (Layer B) — installs the real upstream agent at its latest
#     version, wires it with `defenseclaw setup`, and drives lifecycle + forced
#     tool events through the real harness. Asserts observe/block/OTLP/teardown
#     using canonical audit.db history and filesystem sentinel side-effects.
#     Needs provider secrets, so it never runs for fork pull requests.
#
#     ROLLOUT STATUS: Layer B is currently manual-only (workflow_dispatch). The
#     nightly schedule runs Layer A alone until the live secrets are in place.
#     Gemini CLI and Copilot remain deferred (their native keys are not yet set
#     and have no Azure/Bedrock substitute). Cursor has a manual native-Windows
#     preview cell using CURSOR_API_KEY; it is not a release-certification cell.
#
#   report — rolls every per-cell result up into the job summary, records the
#     resolved upstream version, and opens/updates a `connector-regression`
#     issue on any live-cell failure. Alert-only: it never auto-bumps an
#     approved version (that stays a deliberate human edit of
#     cli/defenseclaw/inventory/validated_versions.json).
#
# Native Windows x64 release certification remains closed for Claude Code.
# The manual, source-built Windows cells here, including Claude Code, are
# evidence-producing preview checks rather than release certification. Codex,
# Claude Code, Cursor, OpenCode, and Antigravity remain pending authentic
# packaged plus official-client evidence. Deterministic contract checks run in
# windows-native.yml; certification stays closed until those gates are integrated.
# Antigravity's official client uses Windows Credential Manager/browser auth,
# so its real-client cell runs only on a dedicated pre-authenticated runner.
# OmniGent 0.7.0 has a separate advisory packaged native-degraded cell in
# windows-native.yml; it is not scheduled as a green certification cell here.

name: Connector Live E2E

on:
  # Staggered two hours after the e2e.yml 07:00 cron so the two heavy
  # nightly suites do not contend for the same hosted-runner pool.
  schedule:
    - cron: "0 9 * * *"
  # Layer A also gates pull requests. Every PR runs one always-on
  # cross-platform smoke cell (codex / macOS) so there is a required
  # connector signal on each change; when the PR touches connector, hook,
  # registry, contract-script, or this workflow, the run expands to the full
  # supported Linux + macOS matrix. Native Windows PR gates are separate.
  # Layer B (live) stays manual-only and never runs for pull requests.
  pull_request:
  workflow_dispatch:
    inputs:
      connector:
        description: "Connector to run (or 'all')"
        type: choice
        default: all
        options:
          - all
          - codex
          - claudecode
          - opencode
          - geminicli
          - cursor
          - copilot
          - openhands
          - hermes
          - windsurf
          - antigravity
      os:
        description: "OS to run (or 'all')"
        type: choice
        default: all
        options:
          - all
          - linux
          - macos
          - windows
      version:
        description: "Upstream agent version to install (live layer)"
        type: string
        default: latest
      mode:
        description: "DefenseClaw enforcement mode for live drivers"
        type: choice
        default: action
        options:
          - action
          - observe
      windows_package_run_id:
        description: "Windows Native CI run ID whose exact-head package artifact feeds the authenticated Antigravity lane"
        type: string
        default: ""
      windows_package_source_commit:
        description: "Exact source commit recorded by the selected immutable Windows package (required for protected Antigravity phases)"
        type: string
        default: ""
      antigravity_phase:
        description: "Antigravity lane phase: automated preview or protected interactive prepare/resume/cleanup"
        type: choice
        default: automated
        options:
          - automated
          - prepare
          - resume
          - cleanup
      antigravity_prepare_run_id:
        description: "Successful protected prepare workflow run ID (required for resume)"
        type: string
        default: ""
      antigravity_prepare_run_attempt:
        description: "Successful protected prepare workflow run attempt (required for resume)"
        type: string
        default: ""
      antigravity_hold_id:
        description: "Protected prepare hold ID (required for resume)"
        type: string
        default: ""
      use_azure:
        description: "Route Codex + OpenHands through Azure OpenAI"
        type: boolean
        default: false
      use_bedrock:
        description: "Route Claude Code + OpenHands through Amazon Bedrock"
        type: boolean
        default: false

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.connector == 'antigravity' && inputs.antigravity_phase != 'automated' && format('connector-live-e2e-antigravity-held-state-{0}', github.repository_id) || format('connector-live-e2e-{0}', github.ref) }}
  cancel-in-progress: ${{ !(github.event_name == 'workflow_dispatch' && inputs.connector == 'antigravity' && inputs.antigravity_phase != 'automated') }}

# Least privilege at the workflow level; the report job widens to
# issues: write only where it is actually needed.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Gate — decide which contract cells to run for this event.
  #
  #   schedule / workflow_dispatch → full 2-OS x 9 Unix matrix.
  #   pull_request                 → just the always-on macOS smoke cell,
  #                                  unless the PR touches connector / hook /
  #                                  registry / contract-script / workflow
  #                                  surfaces or a Windows release-sensitive
  #                                  surface, in which case → full matrix.
  # ---------------------------------------------------------------------------
  changes:
    name: Select contract cells
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.decide.outputs.matrix }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          # Need history back to the PR base so the path diff below is accurate.
          fetch-depth: 0
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # The Unix harness retains the full supported connector matrix.
          # Native Windows contract validation is a separate, explicit x64 matrix.
          full='{"os":["ubuntu-latest","macos-latest"],"connector":["codex","claudecode","geminicli","cursor","copilot","openhands","hermes","windsurf","antigravity"]}'
          # Always-on PR smoke: one connector on one cross-platform OS. macOS is
          # chosen because windows-native.yml separately checks the native
          # Windows hook contract on every PR. This adds the missing native macOS
          # connector signal and is the cell to mark "required" in branch
          # protection. Its check name is "Contract codex / macos-latest".
          minimal='{"os":["macos-latest"],"connector":["codex"]}'

          if [ "${EVENT}" != "pull_request" ]; then
            echo "matrix=${full}" >> "$GITHUB_OUTPUT"
            echo "event=${EVENT} -> full matrix"
            exit 0
          fi

          changed="$(git diff --name-only "${BASE_SHA}"...HEAD)"
          echo "Changed files in PR:"
          printf '%s\n' "${changed}"

          # Keep this allowlist anchored and reviewable. The Windows entries are
          # limited to canonical release workflows, native executable/resource
          # payload sources, installer lifecycle/signing/setup helpers, and the
          # native acceptance harness. Contract:
          # cli/tests/test_connector_live_e2e_path_policy.py.
          # BEGIN connector full-matrix path allowlist
          if printf '%s\n' "${changed}" | grep -qE \
            -e '^internal/gateway/connector/' \
            -e '^internal/gateway/sidecar_observability_v8' \
            -e '^internal/audit/' \
            -e '^internal/observability/redaction/' \
            -e '^internal/cli/' \
            -e '^cli/defenseclaw/inventory/' \
            -e '^cli/defenseclaw/commands/cmd_setup\.py$' \
            -e '^cli/defenseclaw/commands/cmd_init\.py$' \
            -e '^test/e2e/' \
            -e '^scripts/live-connector-e2e/' \
            -e '^\.goreleaser\.yaml$' \
            -e '^\.github/workflows/release\.yaml$' \
            -e '^\.github/workflows/windows-native\.yml$' \
            -e '^cmd/(defenseclaw|defenseclaw-hook|defenseclaw-launcher|defenseclaw-setup|defenseclaw-startup)/' \
            -e '^internal/(tools/)?windowsresources/' \
            -e '^cli/defenseclaw/commands/windows_uninstall_helper\.py$' \
            -e '^cli/defenseclaw/windows_acl\.py$' \
            -e '^scripts/(build-windows-installer|initialize-windows-native-ci-paths|install|invoke-windows-setup-standard-user-ci|test-fresh-install-release-windows|test-upgrade-release-windows|test-windows-disposable-user-safety|test-windows-setup-wizard|upgrade|windows-authenticode|windows-binary-identity|windows-disposable-user-safety|windows-native-ci|windows-native-paths)\.ps1$' \
            -e '^scripts/validate_packaged_v8_resources\.py$' \
            -e '^scripts/windows_installer_artifacts\.py$' \
            -e '^scripts/windows-(disposable-file-guard|disposable-standard-user-launcher|setup-standard-user-launcher)\.cs$' \
            -e '^\.github/workflows/connector-live-e2e\.yml$'; then
            echo "matrix=${full}" >> "$GITHUB_OUTPUT"
            echo "connector/release-sensitive change -> full Linux + macOS matrix"
          else
            echo "matrix=${minimal}" >> "$GITHUB_OUTPUT"
            echo "no connector/release-sensitive change -> macOS codex smoke only"
          fi
          # END connector full-matrix path allowlist

  # ---------------------------------------------------------------------------
  # Layer A — deterministic Unix contract matrix (no secrets).
  # ---------------------------------------------------------------------------
  contract-matrix:
    name: Contract ${{ matrix.connector }} / ${{ matrix.os }}
    needs: changes
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      DC_E2E_RESULTS: ${{ github.workspace }}/connector-live-e2e-results.jsonl
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Select cell + resolve OS label
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_CONNECTOR: ${{ inputs.connector }}
          INPUT_OS: ${{ inputs.os }}
          MATRIX_CONNECTOR: ${{ matrix.connector }}
        run: |
          case "${RUNNER_OS}" in
            Linux)   dcos=linux ;;
            macOS)   dcos=macos ;;
            *)       dcos=unknown ;;
          esac
          echo "DC_E2E_OS=${dcos}" >> "$GITHUB_ENV"

          run=true
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            in_conn="${INPUT_CONNECTOR}"
            in_os="${INPUT_OS}"
            [ "${in_conn}" = "all" ] || [ "${in_conn}" = "${MATRIX_CONNECTOR}" ] || run=false
            [ "${in_os}" = "all" ] || [ "${in_os}" = "${dcos}" ] || run=false
          fi
          echo "run=${run}" >> "$GITHUB_OUTPUT"
          echo "cell ${{ matrix.connector }}/${dcos} selected=${run}"

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        if: steps.select.outputs.run == 'true'
        with:
          go-version-file: go.mod
          cache: true

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        if: steps.select.outputs.run == 'true'

      # Build + install the Python CLI and Go gateway. `make install` runs
      # sync-openclaw-extension (drops the //go:embed placeholder so the
      # gateway compiles without the TS plugin) and skips the OpenClaw plugin
      # entirely because CONNECTOR is not openclaw — hook connectors do not
      # need it. We do NOT run `make plugin` here for the same reason.
      - name: Install DefenseClaw
        if: steps.select.outputs.run == 'true'
        run: make install

      - name: Put DefenseClaw on PATH
        if: steps.select.outputs.run == 'true'
        run: |
          echo "${HOME}/.local/bin" >> "$GITHUB_PATH"
          if [ -d "${{ github.workspace }}/.venv/bin" ]; then
            echo "${{ github.workspace }}/.venv/bin" >> "$GITHUB_PATH"
          fi
          # Windows uv venvs expose entry points under Scripts/, not bin/.
          if [ -d "${{ github.workspace }}/.venv/Scripts" ]; then
            echo "${{ github.workspace }}/.venv/Scripts" >> "$GITHUB_PATH"
          fi

      # Deterministic Go contract tests for this connector. The shared
      # connector lifecycle / observability / verify matrices are
      # connector-parameterized; filtering with -run to the active cell makes
      # a failure point at exactly which connector regressed. A connector with
      # no dedicated subtest matches nothing and `go test` exits 0, so the
      # golden-payload smoke below is its real Layer-A coverage.
      - name: Go contract tests
        if: steps.select.outputs.run == 'true'
        run: |
          go test -count=1 ./test/e2e/ \
            -run "TestConnectorLifecycle_Matrix/${{ matrix.connector }}|TestV7Observability_DestinationAppPerConnector/${{ matrix.connector }}|TestConnectorVerifyCleanOnFreshDataDir/${{ matrix.connector }}|TestGoldenPerConnectorLayout"

      # Golden-payload entrypoint smoke: feed each registry event into the
      # installed Unix hook entrypoint and assert fire + verdict shaping +
      # clean teardown. Native Windows uses the dedicated windows-native.yml.
      - name: Contract entrypoint smoke
        if: steps.select.outputs.run == 'true'
        # Layer A runs agent-less, so the cached agent version is empty and the
        # gateway resolves an "unversioned" hook contract. In action mode the
        # gateway refuses to wire the connector (and thus never writes
        # ~/.defenseclaw/hooks/<connector>-hook.sh) unless drift is accepted,
        # which would make every golden-payload hook invocation exit 127. This
        # is the intended no-agent/exploratory case, so opt in here. Belt and
        # suspenders with the export in contract-smoke.sh, in case the gateway
        # daemon is spawned without inheriting the script's environment.
        env:
          DEFENSECLAW_ALLOW_HOOK_CONTRACT_DRIFT: "1"
        run: bash scripts/live-connector-e2e/run.sh --layer contract --connector "${{ matrix.connector }}"

      - name: Upload contract results
        if: ${{ always() && steps.select.outputs.run == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: connector-live-e2e-results-contract-${{ matrix.connector }}-${{ env.DC_E2E_OS }}
          path: ${{ env.DC_E2E_RESULTS }}
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload contract logs on failure
        if: ${{ failure() && steps.select.outputs.run == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: connector-live-e2e-logs-contract-${{ matrix.connector }}-${{ env.DC_E2E_OS }}
          path: ${{ runner.temp }}/defenseclaw-live-e2e-logs/**
          if-no-files-found: ignore
          retention-days: 7
          include-hidden-files: true

  # ---------------------------------------------------------------------------
  # Layer B — live agent matrix (real agents, secrets, nightly/dispatch).
  # Never runs for fork pull requests: provider secrets must not be exposed to
  # untrusted code, mirroring the full-live gate in e2e.yml.
  # ---------------------------------------------------------------------------
  live-matrix:
    name: Live ${{ matrix.connector }} / ${{ matrix.os }}
    # Manual-only for now: the nightly schedule runs Layer A (contract) alone
    # until live provider secrets are in place. Trigger this layer explicitly
    # via "Run workflow" once keys exist.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      matrix:
        # The reality matrix: which agents have a headless CLI that fires hooks
        # on which OS. Contract-only connectors (hermes, windsurf, antigravity)
        # are absent here — they are covered by Layer A only. Native Windows
        # Candidate Codex/Claude Windows certification evidence is handled by
        # windows-live below; an unrun or failed cell proves nothing.
        #
        # Currently scoped to the connectors we can authenticate with Azure
        # OpenAI / Amazon Bedrock (Codex, Claude Code, OpenHands). Gemini CLI,
        # Cursor, and Copilot are deferred until their native keys exist — add
        # their cells back here when GOOGLE_API_KEY / CURSOR_API_KEY /
        # COPILOT_GITHUB_TOKEN are configured.
        include:
          - { connector: codex,      os: ubuntu-latest,  dcos: linux }
          - { connector: codex,      os: macos-latest,   dcos: macos }
          - { connector: claudecode, os: ubuntu-latest,  dcos: linux }
          - { connector: claudecode, os: macos-latest,   dcos: macos }
          # OpenHands needs the Docker runtime, so it is Linux-only.
          - { connector: openhands,  os: ubuntu-latest,  dcos: linux }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      DC_E2E_OS: ${{ matrix.dcos }}
      DC_E2E_RESULTS: ${{ github.workspace }}/connector-live-e2e-results.jsonl
      DC_DRIVER_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'action' }}
      DC_E2E_AGENT_VERSION_REQUEST: ${{ github.event_name == 'workflow_dispatch' && inputs.version || 'latest' }}
      # Provider keys are read directly by the agent CLIs (e.g. codex, claude)
      # from the process environment. They are also written into
      # ~/.defenseclaw/.env below so the gateway can reach them when needed.
      # Empty secrets simply skip writing that key (see the seed step).
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
      # GitHub Copilot CLI authenticates with an entitled token through its
      # documented highest-precedence environment variable.
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
      # Generic fallback key for the guardrail/judge if a connector needs it.
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      # --- Alternative auth backends -----------------------------------------
      # Azure OpenAI (Codex + OpenHands when DC_USE_AZURE=1). The key is a
      # secret; the endpoint/deployment/version are non-secret config Variables.
      AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
      AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
      AZURE_OPENAI_DEPLOYMENT: ${{ vars.AZURE_OPENAI_DEPLOYMENT }}
      AZURE_OPENAI_API_VERSION: ${{ vars.AZURE_OPENAI_API_VERSION }}
      # Amazon Bedrock (Claude Code + OpenHands when DC_USE_BEDROCK=1). Either a
      # Bedrock bearer token OR a standard AWS key pair satisfies the chain.
      AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      # Optional Bedrock model-id overrides (non-secret config Variables).
      CLAUDE_BEDROCK_MODEL: ${{ vars.CLAUDE_BEDROCK_MODEL }}
      OPENHANDS_BEDROCK_MODEL: ${{ vars.OPENHANDS_BEDROCK_MODEL }}
      # Provider-selection flags. A dispatch toggle wins; otherwise the repo
      # Variable (DC_USE_AZURE / DC_USE_BEDROCK = "1") makes it the default for
      # nightly runs; otherwise off (use the direct provider keys).
      DC_USE_AZURE: ${{ inputs.use_azure && '1' || vars.DC_USE_AZURE || '0' }}
      DC_USE_BEDROCK: ${{ inputs.use_bedrock && '1' || vars.DC_USE_BEDROCK || '0' }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Select cell
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_CONNECTOR: ${{ inputs.connector }}
          INPUT_OS: ${{ inputs.os }}
          MATRIX_CONNECTOR: ${{ matrix.connector }}
          MATRIX_OS: ${{ matrix.dcos }}
        run: |
          run=true
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            in_conn="${INPUT_CONNECTOR}"
            in_os="${INPUT_OS}"
            [ "${in_conn}" = "all" ] || [ "${in_conn}" = "${MATRIX_CONNECTOR}" ] || run=false
            [ "${in_os}" = "all" ] || [ "${in_os}" = "${MATRIX_OS}" ] || run=false
          fi
          echo "run=${run}" >> "$GITHUB_OUTPUT"
          echo "cell ${{ matrix.connector }}/${{ matrix.dcos }} selected=${run}"

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        if: steps.select.outputs.run == 'true'
        with:
          go-version-file: go.mod
          cache: true

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        if: steps.select.outputs.run == 'true'

      # Several live agents still use npm and OpenHands uses pipx. Claude's
      # Windows lane uses Anthropic's native PowerShell installer; Node remains
      # required by the other matrix cells.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        if: steps.select.outputs.run == 'true'
        with:
          node-version: "24"

      - name: Install DefenseClaw
        if: steps.select.outputs.run == 'true'
        run: make install

      - name: Put DefenseClaw on PATH
        if: steps.select.outputs.run == 'true'
        run: |
          echo "${HOME}/.local/bin" >> "$GITHUB_PATH"
          if [ -d "${{ github.workspace }}/.venv/bin" ]; then
            echo "${{ github.workspace }}/.venv/bin" >> "$GITHUB_PATH"
          fi
          if [ -d "${{ github.workspace }}/.venv/Scripts" ]; then
            echo "${{ github.workspace }}/.venv/Scripts" >> "$GITHUB_PATH"
          fi

      # Initialize DefenseClaw and stage provider keys into ~/.defenseclaw/.env.
      # The driver re-runs `defenseclaw init` idempotently; doing it here lets
      # us append keys before the gateway first starts. Only non-empty secrets
      # are written, so a missing optional key never leaves a blank line.
      - name: Seed DefenseClaw env
        if: steps.select.outputs.run == 'true'
        run: |
          defenseclaw init
          env_file="${HOME}/.defenseclaw/.env"
          mkdir -p "${HOME}/.defenseclaw"
          touch "${env_file}"
          write_key() {
            local k="$1" v="$2"
            [ -n "${v}" ] || return 0
            grep -q "^${k}=" "${env_file}" 2>/dev/null && return 0
            printf '%s=%s\n' "${k}" "${v}" >> "${env_file}"
          }
          write_key OPENAI_API_KEY    "${OPENAI_API_KEY:-}"
          write_key ANTHROPIC_API_KEY "${ANTHROPIC_API_KEY:-}"
          write_key GOOGLE_API_KEY    "${GOOGLE_API_KEY:-}"
          write_key GEMINI_API_KEY    "${GEMINI_API_KEY:-}"
          write_key CURSOR_API_KEY    "${CURSOR_API_KEY:-}"
          write_key LLM_API_KEY       "${LLM_API_KEY:-}"

      # For Cursor, confirm headless `agent -p` actually fires
      # ~/.cursor/hooks.json before spending a full live run on it. If hooks
      # never reach the gateway, the live driver is skipped (recorded as a
      # skip) and Cursor stays Layer-A only for this cell.
      - name: Validate Cursor headless hooks
        id: cursor_validate
        if: ${{ steps.select.outputs.run == 'true' && matrix.connector == 'cursor' }}
        run: bash scripts/live-connector-e2e/cursor-validation.sh
        continue-on-error: true

      - name: Live driver
        if: ${{ steps.select.outputs.run == 'true' && !(matrix.connector == 'cursor' && steps.cursor_validate.outputs.cursor_hooks_fire == '0') }}
        run: bash scripts/live-connector-e2e/run.sh --layer live --connector "${{ matrix.connector }}"

      - name: Upload live results
        if: ${{ always() && steps.select.outputs.run == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: connector-live-e2e-results-live-${{ matrix.connector }}-${{ matrix.dcos }}
          path: ${{ env.DC_E2E_RESULTS }}
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload live logs on failure
        if: ${{ failure() && steps.select.outputs.run == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: connector-live-e2e-logs-live-${{ matrix.connector }}-${{ matrix.dcos }}
          path: ${{ runner.temp }}/defenseclaw-live-e2e-logs/**
          if-no-files-found: ignore
          retention-days: 7
          include-hidden-files: true

      - name: Teardown safety net
        if: ${{ always() && steps.select.outputs.run == 'true' }}
        run: |
          defenseclaw-gateway connector teardown --connector "${{ matrix.connector }}" 2>/dev/null || true
          defenseclaw-gateway stop 2>/dev/null || true
          rm -rf "${HOME}/.defenseclaw" 2>/dev/null || true

  windows-live:
    name: Windows x64 live / ${{ matrix.connector }}
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.os == 'all' || inputs.os == 'windows') }}
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        connector: [codex, claudecode, cursor, opencode]
    env:
      DC_WINDOWS_STATE: ${{ github.workspace }}/.dc-e2e-${{ matrix.connector }}-live
      DC_E2E_RESULTS: ${{ github.workspace }}/connector-live-e2e-results.jsonl
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      CODEX_VERSION: ${{ inputs.version }}
      CLAUDE_VERSION: ${{ inputs.version }}
      OPENCODE_VERSION: ${{ inputs.version }}
    steps:
      - name: Select requested Windows connector
        id: select
        shell: pwsh
        env:
          INPUT_CONNECTOR: ${{ inputs.connector }}
          MATRIX_CONNECTOR: ${{ matrix.connector }}
        run: |
          $selected = $env:INPUT_CONNECTOR -eq 'all' -or $env:INPUT_CONNECTOR -eq $env:MATRIX_CONNECTOR
          "run=$($selected.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        if: steps.select.outputs.run == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        if: steps.select.outputs.run == 'true'
        with:
          go-version-file: go.mod
          cache: true
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        if: steps.select.outputs.run == 'true'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        if: steps.select.outputs.run == 'true'
        with:
          node-version: '24'
      - name: Build native DefenseClaw tools
        if: steps.select.outputs.run == 'true'
        shell: pwsh
        run: |
          $embed = Join-Path $env:GITHUB_WORKSPACE 'internal\gateway\connector\openclaw_extension'
          New-Item -ItemType Directory -Force -Path $embed | Out-Null
          Set-Content -LiteralPath (Join-Path $embed '.placeholder') -Value 'OpenClaw extension not built.'
          $bin = Join-Path $env:RUNNER_TEMP 'defenseclaw-bin'
          New-Item -ItemType Directory -Force -Path $bin | Out-Null
          go build -o (Join-Path $bin 'defenseclaw-gateway.exe') ./cmd/defenseclaw
          go build -ldflags '-H=windowsgui' -o (Join-Path $bin 'defenseclaw-hook.exe') ./cmd/defenseclaw-hook
          uv sync
          $bin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          (Join-Path $env:GITHUB_WORKSPACE '.venv\Scripts') | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Native Windows live harness
        if: steps.select.outputs.run == 'true'
        shell: pwsh
        run: |
          ./scripts/live-connector-e2e/run-windows.ps1 `
            -Layer live `
            -Connector '${{ matrix.connector }}' `
            -StateRoot $env:DC_WINDOWS_STATE `
            -ResultsPath $env:DC_E2E_RESULTS `
            -ArtifactPath (Join-Path $env:RUNNER_TEMP 'defenseclaw-live-e2e-logs')
      - name: Upload Windows live results
        if: ${{ always() && steps.select.outputs.run == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: connector-live-e2e-results-live-${{ matrix.connector }}-windows-x64
          path: ${{ env.DC_E2E_RESULTS }}
          if-no-files-found: error
          retention-days: 7
      - name: Capture Windows diagnostics
        if: ${{ (failure() || cancelled()) && steps.select.outputs.run == 'true' }}
        shell: pwsh
        run: ./scripts/live-connector-e2e/run-windows.ps1 -Operation capture -Connector '${{ matrix.connector }}' -StateRoot $env:DC_WINDOWS_STATE -ArtifactPath (Join-Path $env:RUNNER_TEMP 'defenseclaw-live-e2e-logs')
      - name: Upload Windows diagnostics on failure
        if: ${{ (failure() || cancelled()) && steps.select.outputs.run == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: connector-live-e2e-logs-live-${{ matrix.connector }}-windows-x64
          path: ${{ runner.temp }}/defenseclaw-live-e2e-logs/**
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: true
      - name: Windows cleanup safety net
        if: ${{ always() && steps.select.outputs.run == 'true' }}
        shell: pwsh
        run: ./scripts/live-connector-e2e/run-windows.ps1 -Operation cleanup -Connector '${{ matrix.connector }}' -StateRoot $env:DC_WINDOWS_STATE

  # Preview-only: this protected lane exercises the existing installer-shaped
  # maintenance primitive after a public connector=none install. It does not
  # prove Setup's internal Antigravity bootstrap or ordinary public Setup
  # support. Any future certification still requires promotion, an exact
  # package rebuild, and a fresh public Setup retest.
  windows-antigravity-live:
    name: Windows x64 live / antigravity (authenticated)
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
          (inputs.os == 'all' || inputs.os == 'windows') &&
          (inputs.connector == 'all' || inputs.connector == 'antigravity') &&
          inputs.antigravity_phase == 'automated' }}
    runs-on: [self-hosted, Windows, X64, antigravity-authenticated]
    timeout-minutes: 40
    permissions:
      actions: read
      contents: read
    env:
      DC_WINDOWS_STATE: ${{ github.workspace }}/.dc-e2e-antigravity-live
      DC_E2E_RESULTS: ${{ github.workspace }}/connector-live-e2e-results.jsonl
      DC_ANTIGRAVITY_DEDICATED_RUNNER: "1"
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Require exact Windows package run
        id: package
        shell: pwsh
        env:
          PACKAGE_RUN_ID: ${{ inputs.windows_package_run_id }}
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD_SHA: ${{ github.sha }}
        run: |
          if ($env:PACKAGE_RUN_ID -cnotmatch '^[1-9][0-9]*$') {
            throw 'Authenticated Antigravity live E2E requires windows_package_run_id from exact-head Windows Native CI'
          }
          if ($env:GITHUB_REPOSITORY -cnotmatch '^[^/]+/[^/]+$' -or
              $env:EXPECTED_HEAD_SHA -cnotmatch '^[0-9a-f]{40}$' -or
              [string]::IsNullOrWhiteSpace($env:GH_TOKEN)) {
            throw 'Authenticated Antigravity package authorization inputs are invalid'
          }
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $api = "https://api.github.com/repos/$env:GITHUB_REPOSITORY"
          $workflow = Invoke-RestMethod -Headers $headers `
            -Uri "$api/actions/workflows/windows-native.yml" -TimeoutSec 30
          $run = Invoke-RestMethod -Headers $headers `
            -Uri "$api/actions/runs/$env:PACKAGE_RUN_ID" -TimeoutSec 30
          if ([string]$workflow.path -cne '.github/workflows/windows-native.yml' -or
              [long]$run.workflow_id -ne [long]$workflow.id -or
              [string]$run.path -cne '.github/workflows/windows-native.yml' -or
              [string]$run.repository.full_name -cne $env:GITHUB_REPOSITORY -or
              [string]$run.status -cne 'completed' -or
              [string]$run.conclusion -cne 'success' -or
              [string]$run.head_sha -cne $env:EXPECTED_HEAD_SHA) {
            throw 'Selected package run is not the successful exact-head canonical Windows Native CI run'
          }
          $artifacts = Invoke-RestMethod -Headers $headers `
            -Uri "$api/actions/runs/$env:PACKAGE_RUN_ID/artifacts?per_page=100" -TimeoutSec 30
          $packageArtifacts = @($artifacts.artifacts | Where-Object {
            [string]$_.name -ceq 'windows-native-package'
          })
          if ($packageArtifacts.Count -ne 1 -or
              [bool]$packageArtifacts[0].expired -or
              [long]$packageArtifacts[0].size_in_bytes -le 0) {
            throw 'Selected exact Windows Native CI run lacks one unexpired non-empty windows-native-package artifact'
          }
          "artifact_id=$([long]$packageArtifacts[0].id)" >> $env:GITHUB_OUTPUT
          "artifact_digest=$([string]$packageArtifacts[0].digest)" >> $env:GITHUB_OUTPUT
      - name: Protect exact package destination
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'defenseclaw-antigravity-package-${{ github.run_id }}-${{ github.run_attempt }}'
          if (Test-Path -LiteralPath $root) {
            throw "Authenticated package destination already exists: $root"
          }
          $directory = [IO.Directory]::CreateDirectory($root)
          $owner = [Security.Principal.WindowsIdentity]::GetCurrent().User
          if ($null -eq $owner) { throw 'Runner identity has no user SID' }
          $security = [Security.AccessControl.DirectorySecurity]::new()
          $security.SetOwner($owner)
          $security.SetAccessRuleProtection($true, $false)
          $inherit = [Security.AccessControl.InheritanceFlags]::ContainerInherit -bor `
            [Security.AccessControl.InheritanceFlags]::ObjectInherit
          foreach ($sid in @(
            $owner,
            [Security.Principal.SecurityIdentifier]::new('S-1-5-18'),
            [Security.Principal.SecurityIdentifier]::new('S-1-5-32-544')
          )) {
            $security.AddAccessRule([Security.AccessControl.FileSystemAccessRule]::new(
              $sid,
              [Security.AccessControl.FileSystemRights]::FullControl,
              $inherit,
              [Security.AccessControl.PropagationFlags]::None,
              [Security.AccessControl.AccessControlType]::Allow
            )) | Out-Null
          }
          [IO.FileSystemAclExtensions]::SetAccessControl($directory, $security)
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-native-package
          path: ${{ runner.temp }}\defenseclaw-antigravity-package-${{ github.run_id }}-${{ github.run_attempt }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.windows_package_run_id }}
      - name: Require official authenticated Antigravity client
        shell: pwsh
        run: |
          $agy = Get-Command agy.exe -ErrorAction Stop
          $version = & $agy.Source --version
          if ("$version" -notmatch '(?<!\d)1\.(?:[2-9]|\d{2,})\.' -and
              "$version" -notmatch '(?<!\d)1\.1\.(?:[89]|\d{2,})(?!\d)') {
            throw "Antigravity CLI 1.1.8+ is required, got: $version"
          }
      - name: Real official-client E2E
        shell: pwsh
        run: |
          ./scripts/live-connector-e2e/run-windows.ps1 `
            -Layer live `
            -Connector antigravity `
            -AuthenticatedAntigravityRunner `
            -PackagedSetupPath (Join-Path $env:RUNNER_TEMP 'defenseclaw-antigravity-package-${{ github.run_id }}-${{ github.run_attempt }}\DefenseClawSetup-x64.exe') `
            -ExpectedPackageSourceCommit '${{ github.sha }}' `
            -ExpectedHarnessSourceCommit '${{ github.sha }}' `
            -ExpectedPackageRunID '${{ inputs.windows_package_run_id }}' `
            -ExpectedPackageArtifactID '${{ steps.package.outputs.artifact_id }}' `
            -ExpectedPackageArtifactDigest '${{ steps.package.outputs.artifact_digest }}' `
            -ExpectedWorkflowRepository '${{ github.repository }}' `
            -StateRoot $env:DC_WINDOWS_STATE `
            -ResultsPath $env:DC_E2E_RESULTS `
            -ArtifactPath (Join-Path $env:RUNNER_TEMP 'defenseclaw-live-e2e-logs')
      - name: Upload Antigravity live results
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: connector-live-e2e-results-live-antigravity-windows-x64
          path: ${{ env.DC_E2E_RESULTS }}
          if-no-files-found: error
          retention-days: 7
      - name: Upload Antigravity diagnostics on failure
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: connector-live-e2e-logs-live-antigravity-windows-x64
          path: ${{ runner.temp }}/defenseclaw-live-e2e-logs/**
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: true
      - name: Antigravity teardown safety net
        if: ${{ always() }}
        shell: pwsh
        run: |
          ./scripts/live-connector-e2e/run-windows.ps1 `
            -Operation cleanup `
            -Layer live `
            -Connector antigravity `
            -AuthenticatedAntigravityRunner `
            -PackagedSetupPath (Join-Path $env:RUNNER_TEMP 'defenseclaw-antigravity-package-${{ github.run_id }}-${{ github.run_attempt }}\DefenseClawSetup-x64.exe') `
            -ExpectedPackageSourceCommit '${{ github.sha }}' `
            -ExpectedHarnessSourceCommit '${{ github.sha }}' `
            -ExpectedPackageRunID '${{ inputs.windows_package_run_id }}' `
            -ExpectedPackageArtifactID '${{ steps.package.outputs.artifact_id }}' `
            -ExpectedPackageArtifactDigest '${{ steps.package.outputs.artifact_digest }}' `
            -ExpectedWorkflowRepository '${{ github.repository }}' `
            -StateRoot $env:DC_WINDOWS_STATE

  # Protected preview-only lifecycle for authentic interactive Antigravity
  # evidence. Prepare and resume are separate workflow dispatches. The native
  # TUI itself is launched locally between them because Actions does not
  # provide an interactive terminal. Durable authenticated state lives only on
  # the dedicated runner's fixed task-specific D: root.
  windows-antigravity-held-state:
    name: Windows x64 live / antigravity (protected held state)
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
          (inputs.os == 'all' || inputs.os == 'windows') &&
          inputs.connector == 'antigravity' &&
          inputs.antigravity_phase != 'automated' }}
    runs-on: [self-hosted, Windows, X64, antigravity-authenticated]
    concurrency:
      group: connector-live-e2e-antigravity-held-state-${{ github.repository_id }}
      cancel-in-progress: false
    timeout-minutes: 40
    permissions:
      actions: read
      contents: read
    env:
      DC_ANTIGRAVITY_DURABLE_ROOT: D:\DefenseClaw-PR655-Antigravity-Held-State
      DC_WINDOWS_STATE: D:\DefenseClaw-PR655-Antigravity-Held-State\state
      DC_WINDOWS_PACKAGE: D:\DefenseClaw-PR655-Antigravity-Held-State\package\DefenseClawSetup-x64.exe
      DC_ANTIGRAVITY_INSTALLER: D:\DefenseClaw-PR655-Antigravity-Held-State\official-installer\install.ps1
      DC_ANTIGRAVITY_SOURCE: D:\DefenseClaw-PR655-Antigravity-Held-State\source-checkout
      DC_E2E_RESULTS: D:\DefenseClaw-PR655-Antigravity-Held-State\handoff-${{ github.run_id }}-${{ github.run_attempt }}\results.jsonl
      DC_E2E_ARTIFACTS: D:\DefenseClaw-PR655-Antigravity-Held-State\handoff-${{ github.run_id }}-${{ github.run_attempt }}\diagnostics
      DC_ANTIGRAVITY_DEDICATED_RUNNER: "1"
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Read durable protected recovery identity
        id: recovery
        if: ${{ inputs.antigravity_phase != 'prepare' }}
        shell: pwsh
        env:
          PHASE: ${{ inputs.antigravity_phase }}
        run: |
          $root = 'D:\DefenseClaw-PR655-Antigravity-Held-State'
          $manifestPath = "$root\state\antigravity-package-cleanup.json"
          $heldPath = "$root\state\antigravity-held-state.json"
          $rootItem = Get-Item -LiteralPath $root -Force -ErrorAction Stop
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          if ($null -eq $identity.User) { throw 'Protected recovery identity has no user SID' }
          $sections = [Security.AccessControl.AccessControlSections]::Owner -bor `
            [Security.AccessControl.AccessControlSections]::Access
          $security = [IO.FileSystemAclExtensions]::GetAccessControl($rootItem, $sections)
          $owner = $security.GetOwner([Security.Principal.SecurityIdentifier])
          $expected = @($identity.User.Value, 'S-1-5-18', 'S-1-5-32-544') | Sort-Object
          $rules = @($security.GetAccessRules($true, $true, [Security.Principal.SecurityIdentifier]))
          $actual = @($rules | ForEach-Object { $_.IdentityReference.Value } | Sort-Object -Unique)
          if (-not $security.AreAccessRulesProtected -or $owner.Value -cne $identity.User.Value -or
              ($actual -join "`n") -cne ($expected -join "`n") -or
              $rules.Count -ne $expected.Count -or
              @($rules | Where-Object {
                $_.IsInherited -or
                $_.AccessControlType -ne [Security.AccessControl.AccessControlType]::Allow -or
                ($_.FileSystemRights -band [Security.AccessControl.FileSystemRights]::FullControl) -ne
                  [Security.AccessControl.FileSystemRights]::FullControl
              }).Count -ne 0) {
            throw 'Protected durable recovery root DACL is not exact'
          }
          foreach ($path in @($root, "$root\state", $manifestPath, $env:DC_ANTIGRAVITY_SOURCE)) {
            if (-not (Test-Path -LiteralPath $path)) { throw "Protected recovery identity is missing: $path" }
            $item = Get-Item -LiteralPath $path -Force
            if ($item.Attributes -band [IO.FileAttributes]::ReparsePoint) {
              throw "Protected recovery identity crosses a reparse point: $path"
            }
          }
          $manifest = Get-Content -LiteralPath $manifestPath -Raw -Encoding UTF8 | ConvertFrom-Json
          $held = if (Test-Path -LiteralPath $heldPath -PathType Leaf) {
            $heldItem = Get-Item -LiteralPath $heldPath -Force
            if ($heldItem.Attributes -band [IO.FileAttributes]::ReparsePoint) {
              throw 'Protected held-state identity is a reparse point'
            }
            Get-Content -LiteralPath $heldPath -Raw -Encoding UTF8 | ConvertFrom-Json
          } else { $null }
          if ([int]$manifest.schema_version -ne 2 -or
              [string]$manifest.kind -cne 'antigravity-authenticated-cleanup' -or
              [string]$manifest.source_checkout -cne $env:DC_ANTIGRAVITY_SOURCE -or
              -not [bool]$manifest.interactive_campaign) {
            throw 'Protected durable cleanup identity is invalid'
          }
          if ($null -eq $held) {
            if ($env:PHASE -ne 'cleanup' -or [bool]$manifest.vendor_mutation_started) {
              throw 'Only pre-mutation cleanup may recover without a held-state companion'
            }
            foreach ($path in @(
              $manifest.install_root, $manifest.data_root, $manifest.vendor_root,
              $manifest.vendor_staging_root
            )) {
              if (Test-Path -LiteralPath ([string]$path)) {
                throw "Pre-held recovery detected forbidden product/vendor mutation: $path"
              }
            }
          } elseif ([string]$held.kind -cne 'antigravity-interactive-held-state' -or
              [string]$manifest.package_source_commit -cne [string]$held.package_source_commit -or
              [string]$manifest.harness_source_commit -cne [string]$held.harness_source_commit -or
              [string]$manifest.package_run_id -cne [string]$held.package_run_id -or
              [string]$manifest.package_artifact_id -cne [string]$held.package_artifact_id -or
              [string]$manifest.package_artifact_digest -cne [string]$held.package_artifact_digest -or
              [string]$held.source_checkout -cne $env:DC_ANTIGRAVITY_SOURCE) {
            throw 'Protected durable cleanup/held identities disagree'
          }
          $harnessPath = Join-Path $env:DC_ANTIGRAVITY_SOURCE 'scripts\live-connector-e2e\run-windows.ps1'
          $workflowPath = Join-Path $env:DC_ANTIGRAVITY_SOURCE '.github\workflows\connector-live-e2e.yml'
          foreach ($path in @($harnessPath, $workflowPath)) {
            $item = Get-Item -LiteralPath $path -Force -ErrorAction Stop
            if ($item.PSIsContainer -or ($item.Attributes -band [IO.FileAttributes]::ReparsePoint)) {
              throw "Protected durable source identity is not a plain file: $path"
            }
          }
          $head = (& git.exe -C $env:DC_ANTIGRAVITY_SOURCE rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Protected durable source HEAD is unreadable' }
          $dirty = & git.exe -C $env:DC_ANTIGRAVITY_SOURCE status --porcelain=v1 --untracked-files=no
          if ($LASTEXITCODE -ne 0 -or $head -cne [string]$manifest.harness_source_commit -or
              -not [string]::IsNullOrWhiteSpace(($dirty -join "`n")) -or
              (Get-FileHash -LiteralPath $harnessPath -Algorithm SHA256).Hash.ToLowerInvariant() -cne
                [string]$manifest.harness_sha256 -or
              (Get-FileHash -LiteralPath $workflowPath -Algorithm SHA256).Hash.ToLowerInvariant() -cne
                [string]$manifest.workflow_sha256 -or
              ($null -ne $held -and (
                [string]$held.harness_sha256 -cne [string]$manifest.harness_sha256 -or
                [string]$held.workflow_sha256 -cne [string]$manifest.workflow_sha256
              ))) {
            throw 'Protected durable source checkout identity drifted'
          }
          "package_source_commit=$([string]$manifest.package_source_commit)" >> $env:GITHUB_OUTPUT
          "harness_source_commit=$([string]$manifest.harness_source_commit)" >> $env:GITHUB_OUTPUT
          "package_run_id=$([string]$manifest.package_run_id)" >> $env:GITHUB_OUTPUT
          "artifact_id=$([string]$manifest.package_artifact_id)" >> $env:GITHUB_OUTPUT
          "artifact_digest=$([string]$manifest.package_artifact_digest)" >> $env:GITHUB_OUTPUT
      - name: Authorize exact durable package identity
        id: package
        shell: pwsh
        env:
          PACKAGE_RUN_ID: ${{ inputs.windows_package_run_id }}
          RECOVERY_PACKAGE_RUN_ID: ${{ steps.recovery.outputs.package_run_id }}
          INPUT_PACKAGE_SOURCE_COMMIT: ${{ inputs.windows_package_source_commit }}
          RECOVERY_PACKAGE_SOURCE_COMMIT: ${{ steps.recovery.outputs.package_source_commit }}
          RECOVERY_HARNESS_SOURCE_COMMIT: ${{ steps.recovery.outputs.harness_source_commit }}
          PHASE: ${{ inputs.antigravity_phase }}
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HARNESS_SHA: ${{ github.sha }}
        run: |
          if ($env:PHASE -ne 'prepare') { $env:PACKAGE_RUN_ID = $env:RECOVERY_PACKAGE_RUN_ID }
          if ($env:PACKAGE_RUN_ID -cnotmatch '^[1-9][0-9]*$' -or
              $env:GITHUB_REPOSITORY -cnotmatch '^[^/]+/[^/]+$' -or
              $env:EXPECTED_HARNESS_SHA -cnotmatch '^[0-9a-f]{40}$' -or
              [string]::IsNullOrWhiteSpace($env:GH_TOKEN)) {
            throw 'Protected Antigravity package authorization inputs are invalid'
          }
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $api = "https://api.github.com/repos/$env:GITHUB_REPOSITORY"
          $workflow = Invoke-RestMethod -Headers $headers -Uri "$api/actions/workflows/windows-native.yml" -TimeoutSec 30
          $run = Invoke-RestMethod -Headers $headers -Uri "$api/actions/runs/$env:PACKAGE_RUN_ID" -TimeoutSec 30
          $requiredPackageSource = if ($env:PHASE -eq 'prepare') {
            $env:INPUT_PACKAGE_SOURCE_COMMIT
          } else { $env:RECOVERY_PACKAGE_SOURCE_COMMIT }
          if ($requiredPackageSource -cnotmatch '^[0-9a-f]{40}$') {
            throw 'Protected lifecycle requires the immutable package source commit'
          }
          if ($env:PHASE -in @('resume', 'cleanup') -and
              $env:RECOVERY_HARNESS_SOURCE_COMMIT -cne $env:EXPECTED_HARNESS_SHA) {
            throw 'Protected continuation must run from the exact harness/workflow commit used by prepare'
          }
          if ([string]$workflow.path -cne '.github/workflows/windows-native.yml' -or
